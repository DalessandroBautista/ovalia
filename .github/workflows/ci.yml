name: CI

on:
  pull_request:
  push:
    branches: [master, feat/real-data-platform]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ovalia
          POSTGRES_PASSWORD: ovalia
          POSTGRES_DB: ovalia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ovalia -d ovalia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ovalia:ovalia@localhost:5432/ovalia_test
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm verify
      - run: pnpm build
      - run: pnpm audit:hardcodes
      - run: pnpm audit --prod --audit-level high
