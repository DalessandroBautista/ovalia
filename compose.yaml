services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ovalia
      POSTGRES_USER: ovalia
      POSTGRES_PASSWORD: ovalia
    ports:
      - "54329:5432"
    volumes:
      - ovalia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovalia -d ovalia"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  ovalia-postgres:
